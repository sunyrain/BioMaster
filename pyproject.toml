[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "biomaster"
version = "0.1.0"
description = "Drug-repositioning screening workflow for FDA-approved molecules, human targets, disease evidence, and docking follow-up."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
workflow = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]
odti = [
    "joblib>=1.3",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "rdkit>=2023.9",
    "scikit-learn>=1.3",
    "torch>=2.1",
]
structure = [
    "biopython>=1.85",
    "pyyaml>=6.0",
    "rdkit>=2023.9",
]
reports = [
    "reportlab>=4.0",
    "weasyprint>=68.0",
    "pymupdf>=1.24",
]
production = [
    "biopython>=1.85",
    "joblib>=1.3",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "rdkit>=2023.9",
    "reportlab>=4.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "weasyprint>=68.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.scripts]
biomaster = "biomaster.cli:main"

[tool.setuptools]
packages = ["biomaster"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
