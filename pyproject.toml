[project]
name = "biomaster"
version = "0.1.0"
description = "Drug-repositioning screening workflow for FDA-approved molecules, human targets, disease evidence, and docking follow-up."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
biomaster = "biomaster.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
