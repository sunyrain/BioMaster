<text x="252" y="998" font-size="22" font-weight="400" fill="#526278" text-anchor="start">保留向量级全局交互；原子—残基交互与口袋几何经消融后未纳入本版。</text>
<text x="65" y="1040" font-size="18" font-weight="400" fill="#7b899a" text-anchor="start">图中预训练编码器表示特征来源；交付包直接读取必要缓存。排序分数不是结合概率或亲和力。</text>
