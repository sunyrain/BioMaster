<marker id="7250AE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7250AE"/></marker>
<marker id="AE6F17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AE6F17"/></marker>
</defs>
<rect x="0" y="0" width="1920" height="1370" rx="0" fill="#F7F9FC" stroke="none" stroke-width="1.5"/>
