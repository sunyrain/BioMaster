<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1370" viewBox="0 0 1920 1370" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif">
<title>BioMaster 当前已实现架构：V3 冻结底座与 J 双向增量模块</title>
<desc>两底座冻结集成，三个独立训练的增量模块。输入为Morgan、蛋白预训练特征、训练期正负支持库和BerMol/完整ESM2全局向量。输出药找靶和靶找药的不同排序分数。</desc>
<defs>
<marker id="326AB4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#326AB4"/></marker>
